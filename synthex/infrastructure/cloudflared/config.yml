# SYNTHEX — tunnel Cloudflare (JANUS). Aucun port public exposé.
# Le token du tunnel est passé via CLOUDFLARE_TUNNEL_TOKEN (docker-compose).
tunnel: synthex
no-autoupdate: true

ingress:
  - hostname: n8n.synthex.ai
    service: http://n8n:5678
  - hostname: api.synthex.ai
    service: http://langgraph-api:8001
  - hostname: metrics.synthex.ai
    service: http://metrics-api:8002
  - hostname: grafana.synthex.ai
    service: http://grafana:3000
  - hostname: synthex.ai
    service: http://nginx:80
  # Règle de repli obligatoire.
  - service: http_status:404
