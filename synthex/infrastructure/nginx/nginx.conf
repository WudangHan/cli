# SYNTHEX — nginx : sert les pages statiques du site.
server {
    listen 80;
    server_name synthex.ai _;

    root /usr/share/nginx/html;
    index index.html;

    # JSON correctement typé (agents.html fetch le contrat).
    types {
        application/json json;
        text/html        html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # Cache léger des assets statiques.
    location ~* \.(?:json|css|js|svg|png|jpg|gif|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
