# SYNTHEX — configuration Prometheus (ARGUS)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: metrics-api
    metrics_path: /metrics
    static_configs:
      - targets: ["metrics-api:8002"]

  - job_name: langgraph-api
    metrics_path: /metrics
    static_configs:
      - targets: ["langgraph-api:8001"]

  - job_name: n8n
    static_configs:
      - targets: ["n8n:5678"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
