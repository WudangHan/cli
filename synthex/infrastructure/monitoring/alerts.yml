# SYNTHEX — règles d'alerte Prometheus (ARGUS)
groups:
  - name: synthex
    rules:
      - alert: MetricsApiDown
        expr: up{job="metrics-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "metrics-api injoignable"
          description: "Le scrape de metrics-api échoue depuis 2 min."

      - alert: N8nDown
        expr: up{job="n8n"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "n8n injoignable"
          description: "L'orchestrateur n8n ne répond plus depuis 2 min."

      - alert: PostgresSaturated
        expr: pg_stat_activity_count >= 90
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "PostgreSQL proche de la saturation"
          description: "Plus de 90 connexions actives sur PostgreSQL."

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1.5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Latence P95 élevée"
          description: "La latence P95 dépasse 1.5s depuis 5 min."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.10
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Espace disque VPS faible"
          description: "Moins de 10% d'espace disque disponible sur la racine."
