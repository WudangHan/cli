<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SYNTHEX · 12 Agents</title>
  <style>
    :root{--bg:#0b0e14;--panel:#141a24;--line:#222c3a;--txt:#e6edf3;--mut:#8b98a9;--gold:#d4af37;--blue:#4f9dff}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    a{color:inherit;text-decoration:none}
    .sgn-bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:12px 24px;background:rgba(11,14,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
    .sgn-bar a{color:var(--mut);font-size:14px;font-weight:600;transition:color .15s}
    .sgn-bar a:hover{color:var(--txt)}
    .sgn-brand{color:var(--txt)!important;font-size:18px;letter-spacing:1px;margin-right:auto}
    .sgn-gold{color:var(--gold)!important;border:1px solid var(--gold);border-radius:999px;padding:4px 14px}
    .sgn-gold:hover{background:var(--gold);color:#0b0e14!important}
    .wrap{max-width:1100px;margin:0 auto;padding:40px 24px}
    h1{font-size:38px;margin:0 0 6px;letter-spacing:1px}
    .sub{color:var(--mut);margin:0 0 30px}
    .layer{margin:34px 0}
    .layer-head{display:flex;align-items:baseline;gap:12px;border-left:4px solid var(--lc,#888);padding-left:12px;margin-bottom:14px}
    .layer-head h2{margin:0;font-size:22px}
    .layer-head .tag{color:var(--mut);font-size:14px}
    .layer-head .lid{margin-left:auto;color:var(--mut);font-size:13px;letter-spacing:2px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
    .agent{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
    .agent .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
    .agent .code{font-size:18px;font-weight:800;letter-spacing:1px}
    .veto{font-size:11px;font-weight:700;letter-spacing:1px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
    .veto.ABSOLU{color:#0b0e14;background:var(--gold);border-color:var(--gold)}
    .veto.LEGAL{color:#fbbf24;border-color:#fbbf24}
    .veto.FINANCIER{color:#f87171;border-color:#f87171}
    .veto.SECURITE{color:#a78bfa;border-color:#a78bfa}
    .agent .role{color:var(--blue);font-size:13px;font-weight:600;margin-bottom:8px}
    .agent .desc{color:var(--mut);font-size:14px;margin:0 0 12px}
    .tasks{display:flex;flex-wrap:wrap;gap:6px}
    .tasks span{font-size:11px;color:var(--mut);background:#0d1118;border:1px solid var(--line);border-radius:6px;padding:3px 8px}
    .err{background:#2a1416;border:1px solid #f87171;color:#fca5a5;border-radius:10px;padding:16px;margin-top:20px}
    footer{color:var(--mut);text-align:center;padding:40px 0;border-top:1px solid var(--line);font-size:14px;margin-top:50px}
  </style>
</head>
<body>
  <nav class="sgn-bar">
    <a class="sgn-brand" href="index.html">&#9670; SYNTHEX</a>
    <a href="index.html">Accueil</a>
    <a href="services.html">Services</a>
    <a href="agents.html">Agents</a>
    <a href="ops.html">Op&eacute;rations</a>
    <a class="sgn-gold" href="dashboard.html">&#9733; Dashboard Pr&eacute;sident</a>
  </nav>

  <div class="wrap">
    <h1>Les 12 agents</h1>
    <p class="sub">G&eacute;n&eacute;r&eacute; dynamiquement depuis <code>SYNTHEX_Contrats_Agents_v1.0.json</code> &mdash; 4 couches, r&ocirc;les, niveaux de veto et types de t&acirc;ches.</p>
    <div id="layers"></div>
  </div>

  <footer>SYNTHEX Corporation Agentique &middot; synthex.ai</footer>

  <script>
    const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    function render(data){
      const root = document.getElementById('layers');
      root.innerHTML = data.layers.map(layer => `
        <div class="layer" style="--lc:${esc(layer.color)}">
          <div class="layer-head" style="--lc:${esc(layer.color)}">
            <h2>${esc(layer.name)}</h2>
            <span class="tag">${esc(layer.tagline)}</span>
            <span class="lid">${esc(layer.id)}</span>
          </div>
          <div class="grid">
            ${layer.agents.map(a => `
              <div class="agent">
                <div class="top">
                  <span class="code">${esc(a.code)}</span>
                  <span class="veto ${esc(a.veto)}">VETO&nbsp;${esc(a.veto)}</span>
                </div>
                <div class="role">${esc(a.role)}</div>
                <p class="desc">${esc(a.description)}</p>
                <div class="tasks">${a.tasks.map(t => `<span>${esc(t)}</span>`).join('')}</div>
              </div>`).join('')}
          </div>
        </div>`).join('');
    }

    fetch('SYNTHEX_Contrats_Agents_v1.0.json')
      .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(render)
      .catch(e => {
        document.getElementById('layers').innerHTML =
          `<div class="err">Impossible de charger les contrats d'agents (${esc(e.message)}). Servez cette page via HTTP (ex&nbsp;: nginx ou <code>python3 -m http.server</code>) plut&ocirc;t qu'en <code>file://</code>.</div>`;
      });
  </script>
</body>
</html>
