<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SYNTHEX · Dashboard Président</title>
  <style>
    :root{--bg:#0b0e14;--panel:#141a24;--line:#222c3a;--txt:#e6edf3;--mut:#8b98a9;--gold:#d4af37;--blue:#4f9dff;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    a{color:inherit;text-decoration:none}
    .sgn-bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:12px 24px;background:rgba(11,14,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
    .sgn-bar a{color:var(--mut);font-size:14px;font-weight:600;transition:color .15s}
    .sgn-bar a:hover{color:var(--txt)}
    .sgn-brand{color:var(--txt)!important;font-size:18px;letter-spacing:1px;margin-right:auto}
    .sgn-gold{color:var(--gold)!important;border:1px solid var(--gold);border-radius:999px;padding:4px 14px}
    .wrap{max-width:1100px;margin:0 auto;padding:34px 24px}
    .head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
    h1{font-size:34px;margin:0;letter-spacing:1px}
    .mode{font-size:12px;font-weight:700;letter-spacing:1px;padding:5px 12px;border-radius:999px;border:1px solid var(--line)}
    .mode.live{color:#04101f;background:var(--ok);border-color:var(--ok)}
    .mode.demo{color:var(--warn);border-color:var(--warn)}
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:26px 0}
    .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
    .kpi .label{color:var(--mut);font-size:13px;letter-spacing:1px;text-transform:uppercase}
    .kpi .val{font-size:34px;font-weight:800;margin:6px 0 2px}
    .kpi .delta{font-size:13px;color:var(--ok)}
    .kpi .delta.down{color:var(--bad)}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:18px}
    .panel h2{margin:0 0 12px;font-size:18px}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px}
    th{color:var(--mut);font-weight:600}
    tr:last-child td{border-bottom:0}
    .hash{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);font-size:12px}
    .foot{color:var(--mut);font-size:13px;margin-top:14px}
    code{background:#0d1118;border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  </style>
</head>
<body>
  <nav class="sgn-bar">
    <a class="sgn-brand" href="index.html">&#9670; SYNTHEX</a>
    <a href="index.html">Accueil</a>
    <a href="services.html">Services</a>
    <a href="agents.html">Agents</a>
    <a href="ops.html">Op&eacute;rations</a>
    <a class="sgn-gold" href="dashboard.html">&#9733; Dashboard Pr&eacute;sident</a>
  </nav>

  <div id="root" class="wrap"></div>

  <!-- ============ SYNTHEX_API_CONFIG ============ -->
  <script>
    /* Pont API MINERVA. Active le mode live en stockant une clé :
       depuis la console DevTools -> synthexSetApiKey('votre-cle')
       puis rechargez la page. */
    window.SYNTHEX_API_CONFIG = {
      baseUrl: 'https://metrics.synthex.ai',   // metrics-api (asyncpg)
      refreshMs: 60000,
      apiKey: localStorage.getItem('synthex_api_key') || null
    };
    window.synthexSetApiKey = function (key) {
      localStorage.setItem('synthex_api_key', key);
      console.log('[SYNTHEX] Clé API enregistrée. Rechargez la page pour passer en mode live.');
    };
    window.synthexClearApiKey = function () {
      localStorage.removeItem('synthex_api_key');
      console.log('[SYNTHEX] Clé API supprimée. Mode démo au prochain rechargement.');
    };

    async function fetchSynthexMetrics() {
      const cfg = window.SYNTHEX_API_CONFIG;
      if (!cfg.apiKey) throw new Error('no-api-key');
      const headers = { 'Authorization': 'Bearer ' + cfg.apiKey };
      const get = async path => {
        const r = await fetch(cfg.baseUrl + path, { headers });
        if (!r.ok) throw new Error('HTTP ' + r.status + ' on ' + path);
        return r.json();
      };
      const [mrr, leads, audit] = await Promise.all([
        get('/metrics/mrr'),
        get('/metrics/leads'),
        get('/metrics/audit')
      ]);
      return { mrr, leads, audit, live: true };
    }

    // Données de repli (mode démo) si l'API n'est pas joignable.
    const SYNTHEX_DEMO = {
      live: false,
      mrr: { value: 18420, currency: 'CAD', delta_pct: 12.4, customers: 9 },
      leads: { total: 142, qualified: 38, conversion_pct: 26.8, delta_pct: 4.1 },
      audit: { entries: [
        { ts: '2026-06-06 06:00', agent: 'OUROBOROS', action: 'daily_brief', hash: 'a91f…7c2e' },
        { ts: '2026-06-05 14:22', agent: 'ARES', action: 'veto_review', hash: '4db0…1f9a' },
        { ts: '2026-06-05 11:08', agent: 'DIANA', action: 'lead_scored', hash: 'cc73…0e55' },
        { ts: '2026-06-05 09:47', agent: 'MERCURY', action: 'email_sent', hash: '2a1e…b6d4' }
      ]}
    };
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    (function () {
      var e = React.createElement;
      var useState = React.useState, useEffect = React.useEffect;

      function fmtMoney(v, cur) {
        try { return new Intl.NumberFormat('fr-CA', { style: 'currency', currency: cur || 'CAD', maximumFractionDigits: 0 }).format(v); }
        catch (_) { return v + ' ' + (cur || 'CAD'); }
      }

      function Kpi(p) {
        return e('div', { className: 'kpi' },
          e('div', { className: 'label' }, p.label),
          e('div', { className: 'val' }, p.value),
          p.delta != null ? e('div', { className: 'delta' + (p.delta < 0 ? ' down' : '') },
            (p.delta < 0 ? '▼ ' : '▲ ') + Math.abs(p.delta) + '% vs mois dern.') : null
        );
      }

      function Dashboard() {
        var s = useState(SYNTHEX_DEMO), data = s[0], setData = s[1];

        useEffect(function () {
          var stop = false;
          function load() {
            fetchSynthexMetrics()
              .then(function (d) { if (!stop) setData(d); })
              .catch(function () { if (!stop) setData(SYNTHEX_DEMO); });
          }
          load();
          var id = setInterval(load, (window.SYNTHEX_API_CONFIG.refreshMs) || 60000);
          return function () { stop = true; clearInterval(id); };
        }, []);

        return e('div', null,
          e('div', { className: 'head' },
            e('h1', null, 'Dashboard Président'),
            e('span', { className: 'mode ' + (data.live ? 'live' : 'demo') },
              data.live ? '● LIVE — MINERVA' : '○ MODE DÉMO')
          ),
          e('div', { className: 'kpis' },
            e(Kpi, { label: 'MRR', value: fmtMoney(data.mrr.value, data.mrr.currency), delta: data.mrr.delta_pct }),
            e(Kpi, { label: 'Clients actifs', value: data.mrr.customers, delta: null }),
            e(Kpi, { label: 'Leads (30j)', value: data.leads.total, delta: data.leads.delta_pct }),
            e(Kpi, { label: 'Taux de conversion', value: data.leads.conversion_pct + '%', delta: null })
          ),
          e('div', { className: 'panel' },
            e('h2', null, "Journal d'audit — THEMIS"),
            e('table', null,
              e('thead', null, e('tr', null,
                e('th', null, 'Horodatage'), e('th', null, 'Agent'),
                e('th', null, 'Action'), e('th', null, 'Hash SHA-256'))),
              e('tbody', null, data.audit.entries.map(function (r, i) {
                return e('tr', { key: i },
                  e('td', null, r.ts), e('td', null, r.agent),
                  e('td', null, r.action), e('td', { className: 'hash' }, r.hash));
              }))
            ),
            e('div', { className: 'foot' },
              'Auto-refresh ', ((window.SYNTHEX_API_CONFIG.refreshMs || 60000) / 1000),
              's · Mode live : ', e('code', null, "synthexSetApiKey('clé')"), ' dans la console.')
          )
        );
      }

      var mount = document.getElementById('root');
      if (window.React && window.ReactDOM) {
        ReactDOM.createRoot(mount).render(e(Dashboard));
      } else {
        mount.innerHTML = '<p style="color:#f87171">React n\'a pas pu être chargé (réseau requis pour le CDN).</p>';
      }
    })();
  </script>
</body>
</html>
